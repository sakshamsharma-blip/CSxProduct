<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/crelio-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrelioHealth Flow</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved display mode before the page paints (no light flash in dark mode).
      (function () {
        try {
          var m = localStorage.getItem('flow-theme') || 'system';
          var dark = m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-gray-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
